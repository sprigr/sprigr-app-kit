name: release

# Publishes the core packages to npm under the @sprigr scope.
#
# Trigger:
#   - push to main (touching packages/**)  →  publish any package whose
#     version is not yet on npm
#   - workflow_dispatch                    →  re-run against the current tip
#
# The version bump IS the release signal, exactly like the marketplace-app
# publish flow in sprigr-apps: bump the package version in your PR, and
# merging it publishes. Merges that don't change a version publish nothing,
# because every already-published version is skipped — which also makes the
# workflow safe to re-run.
#
# Feature branches never publish; only merges into main do, so two open PRs
# can't race the registry.
#
# Required repo secret: NPM_TOKEN (automation token with publish rights
# on the @sprigr npm scope).

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

# Serialise releases: a second merge landing mid-publish would otherwise race
# the registry read that decides what to skip.
concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -r --filter './packages/*' test
      - name: Publish (skips versions already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in app-sdk oauth-utils d1-kv sync-cursor dedup-latch webhook-registry faceted-search timezone-picker; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip: $name@$version already published"
              continue
            fi
            echo "publishing $name@$version"
            (cd "$dir" && pnpm build && npm publish --access public --provenance)
          done
