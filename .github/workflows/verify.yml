name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (resolved 2026-10-08)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-10-08)
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lockfile has no phantom importers
        # `pnpm install --frozen-lockfile` above does NOT catch this. pnpm keeps an
        # importer block for a workspace directory that no longer exists rather than
        # failing, so a phantom block survives every CI run and only vanishes the next
        # time a contributor regenerates the lockfile; their unrelated PR then carries
        # a lockfile deletion it never intended (issue #53, `apps/kek-probe`).
        #
        # A resolve-only install rewrites the lockfile exactly as a contributor's
        # `pnpm install` would, so the resulting diff is the check.
        # `--no-frozen-lockfile` is required: pnpm defaults frozen-lockfile to true
        # whenever CI is set, which would make this step a silent no-op.
        run: |
          pnpm install --no-frozen-lockfile --lockfile-only --ignore-scripts
          git diff --exit-code pnpm-lock.yaml
      - name: Vendor drift + migration immutability
        run: pnpm verify:local
      - name: Package tests
        run: pnpm -r --filter './packages/*' test
      - name: Package builds
        run: pnpm -r --filter './packages/*' --if-present build
      - name: Reference app
        run: pnpm -F harvest typecheck && pnpm -F harvest test && pnpm -F harvest build
