<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static Badge</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f6f7f4; }
      .badge { padding: 24px 32px; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; }
      .badge h1 { margin: 0 0 8px; color: #5a7a4a; }
      .badge p { margin: 0; color: #666; }
    </style>
  </head>
  <body>
    <div class="badge">
      <h1>Static Badge</h1>
      <p>A static-tier Sprigr marketplace app. No Worker, no build step — just files served from R2.</p>
    </div>
  </body>
</html>
